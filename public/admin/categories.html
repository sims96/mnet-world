<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories - Mnet's World Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <div class="mobile-header"></div>
    <div class="sidebar-overlay"></div>
    <aside class="admin-sidebar"></aside>

    <main class="admin-main">
      <div class="page-header">
        <h1>Categories</h1>
      </div>

      <!-- Add New Category -->
      <div class="admin-card">
        <div class="card-header">
          <h2>Add New Category</h2>
        </div>
        <div class="card-body">
          <form id="add-category-form">
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end;">
              <div class="form-group" style="flex: 2; min-width: 180px; margin-bottom: 0;">
                <label class="form-label" for="new-cat-name">Name <span class="required">*</span></label>
                <input type="text" id="new-cat-name" class="form-input" placeholder="e.g. Wedding Cakes" required>
              </div>
              <div class="form-group" style="flex: 3; min-width: 180px; margin-bottom: 0;">
                <label class="form-label" for="new-cat-desc">Description</label>
                <input type="text" id="new-cat-desc" class="form-input" placeholder="Optional description">
              </div>
              <div class="form-group" style="flex: 0 0 80px; margin-bottom: 0;">
                <label class="form-label" for="new-cat-order">Order</label>
                <input type="number" id="new-cat-order" class="form-input" value="0" min="0">
              </div>
              <div class="form-group" style="margin-bottom: 0;">
                <button type="submit" class="btn btn-primary">+ Add</button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <!-- Categories Table -->
      <div class="admin-card">
        <div class="card-body" style="padding: 0;">
          <div class="table-responsive">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>Order</th>
                  <th>Name</th>
                  <th>Slug</th>
                  <th>Description</th>
                  <th>Created</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="categories-table">
                <tr>
                  <td colspan="6">
                    <div class="loading-state" style="padding: 2rem;">
                      <div class="loading-spinner"></div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Edit Modal -->
  <div class="modal-overlay" id="edit-modal">
    <div class="modal" style="text-align: left; max-width: 500px;">
      <h3>Edit Category</h3>
      <form id="edit-category-form">
        <div class="form-group">
          <label class="form-label" for="edit-cat-name">Name <span class="required">*</span></label>
          <input type="text" id="edit-cat-name" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-cat-desc">Description</label>
          <input type="text" id="edit-cat-desc" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label" for="edit-cat-order">Display Order</label>
          <input type="number" id="edit-cat-order" class="form-input" min="0">
        </div>
        <div class="modal-actions" style="justify-content: flex-end;">
          <button type="button" class="btn btn-secondary" id="edit-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Changes</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="/js/admin/auth.js"></script>
  <script src="/js/admin/categories.js"></script>
</body>
</html>
