<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages - Mnet's World Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/admin-chat.css">
</head>
<body class="admin-body">
  <div class="admin-layout">
    <!-- Mobile Header -->
    <div class="mobile-header"></div>
    <div class="sidebar-overlay"></div>

    <!-- Sidebar -->
    <aside class="admin-sidebar"></aside>

    <!-- Main Content -->
    <main class="admin-main" style="padding: 0; overflow: hidden; display: flex; flex-direction: column;">

      <!-- Tabs -->
      <div class="chat-admin__tabs">
        <button class="chat-admin__tab active" data-tab="chats">Live Chat</button>
        <button class="chat-admin__tab" data-tab="contact">Contact Form</button>
      </div>

      <!-- ═══ Tab 1: Live Chat ═══ -->
      <div class="chat-admin__tab-content active" id="tab-chats">
        <div class="chat-admin">

          <!-- Left: Sessions List -->
          <div class="chat-admin__sessions" id="sessions-panel">
            <div class="chat-admin__sessions-header">
              <h2>Conversations</h2>
              <span class="badge badge-info" id="active-count" style="display: none;"></span>
            </div>
            <div class="chat-admin__sessions-list" id="sessions-list">
              <div class="loading-state" style="padding: 2rem; text-align: center;">
                <div class="loading-spinner"></div>
              </div>
            </div>
          </div>

          <!-- Right: Messages Panel -->
          <div class="chat-admin__messages" id="messages-panel">

            <!-- Empty state -->
            <div class="chat-admin__empty" id="no-session">
              <div style="font-size: 3rem; opacity: 0.3; margin-bottom: 0.5rem;">&#128172;</div>
              <p style="color: #9B9B9B;">Select a conversation to start chatting</p>
            </div>

            <!-- Active conversation -->
            <div class="chat-admin__conversation" id="active-conversation" style="display: none;">
              <div class="chat-admin__conv-header">
                <div class="chat-admin__conv-info">
                  <button class="chat-admin__back-btn" id="btn-back" title="Back to conversations">&#8592;</button>
                  <strong id="conv-visitor-name">Visitor</strong>
                  <span id="conv-status" class="badge badge-success" style="margin-left: 8px;">Active</span>
                </div>
                <button class="btn btn-sm btn-outline" id="btn-close-session">Close Chat</button>
              </div>
              <div class="chat-admin__conv-messages" id="conv-messages"></div>
              <div class="chat-admin__conv-input" id="conv-input">
                <textarea class="form-input" id="reply-input" placeholder="Type your reply..." rows="2"></textarea>
                <button class="btn btn-primary" id="btn-send-reply">Send</button>
              </div>
            </div>
          </div>

        </div>
      </div>

      <!-- ═══ Tab 2: Contact Form Submissions ═══ -->
      <div class="chat-admin__tab-content" id="tab-contact" style="overflow-y: auto;">
        <div style="padding: var(--space-6);">
          <div class="admin-card">
            <div class="card-header" style="display: flex; align-items: center; justify-content: space-between;">
              <h2>Contact Form Submissions</h2>
              <span class="badge badge-info" id="contact-unread-count" style="display: none;"></span>
            </div>
            <div class="card-body" style="padding: 0;">
              <div class="table-responsive">
                <table class="admin-table">
                  <thead>
                    <tr>
                      <th style="width: 30px;"></th>
                      <th>Name</th>
                      <th>Email</th>
                      <th>Subject</th>
                      <th>Message</th>
                      <th>Date</th>
                      <th>Actions</th>
                    </tr>
                  </thead>
                  <tbody id="contact-table">
                    <tr>
                      <td colspan="7">
                        <div class="loading-state" style="padding: 2rem;">
                          <div class="loading-spinner"></div>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Contact Message Modal -->
      <div class="modal-overlay" id="contact-modal">
        <div class="modal" style="max-width: 560px; text-align: left;">
          <h3 id="modal-subject" style="margin-bottom: 0.5rem;"></h3>
          <p style="margin-bottom: 1rem; color: #6B6B6B; font-size: 0.875rem;">
            From: <strong id="modal-name"></strong> &lt;<span id="modal-email"></span>&gt;<br>
            Received: <span id="modal-date"></span>
          </p>
          <div id="modal-message" style="white-space: pre-wrap; line-height: 1.6; padding: 1rem; background: #F9FAFB; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.9375rem;"></div>
          <div class="modal-actions" style="justify-content: flex-end;">
            <button class="btn btn-secondary" onclick="closeContactModal()">Close</button>
            <a id="modal-reply" class="btn btn-primary" href="#" target="_blank">Reply via Email</a>
          </div>
        </div>
      </div>

    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="/js/admin/auth.js"></script>
  <script src="/js/admin/chat.js"></script>
</body>
</html>
