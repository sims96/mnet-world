<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Mnet's World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Lato:wght@300;400;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
  <div class="login-page">
    <div class="login-card">
      <div class="login-logo">Mnet's World</div>
      <p class="login-subtitle" id="page-subtitle">Admin Panel</p>

      <div class="login-error" id="error-msg"></div>

      <!-- Login Form -->
      <form id="login-form" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="login-username">Username</label>
          <input type="text" id="login-username" class="form-input" placeholder="Enter your username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">Sign In</button>
      </form>

      <!-- Setup Form -->
      <form id="setup-form" style="display: none;">
        <div class="form-group">
          <label class="form-label" for="setup-username">Username</label>
          <input type="text" id="setup-username" class="form-input" placeholder="Choose a username" required autocomplete="username">
        </div>
        <div class="form-group">
          <label class="form-label" for="setup-password">Password</label>
          <input type="password" id="setup-password" class="form-input" placeholder="At least 8 characters" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label" for="setup-confirm">Confirm Password</label>
          <input type="password" id="setup-confirm" class="form-input" placeholder="Re-enter your password" required autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" id="setup-btn">Create Account</button>
      </form>

      <!-- Loading state -->
      <div id="loading-state" class="loading-state" style="padding: 2rem 0;">
        <div class="loading-spinner"></div>
        <p style="font-size: 0.875rem; color: #6B6B6B;">Checking status...</p>
      </div>

      <div class="login-footer">
        <a href="/">&larr; Back to Mnet's World</a>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <script src="/js/admin/auth.js"></script>
  <script>
    (async function() {
      const loginForm = document.getElementById('login-form');
      const setupForm = document.getElementById('setup-form');
      const loadingState = document.getElementById('loading-state');
      const subtitle = document.getElementById('page-subtitle');
      const errorMsg = document.getElementById('error-msg');

      // Check if already logged in
      try {
        const res = await adminApi('GET', '/api/auth/me');
        if (res.user) {
          window.location.href = '/admin/dashboard.html';
          return;
        }
      } catch (e) {
        // Not logged in - continue
      }

      // Check if setup is needed
      try {
        const res = await adminApi('POST', '/api/auth/setup', { username: '', password: '' });
        // If we get here without error, setup succeeded (unlikely with empty fields)
      } catch (e) {
        if (e.message && e.message.includes('already exists')) {
          // Admin exists - show login form
          loadingState.style.display = 'none';
          loginForm.style.display = 'block';
          subtitle.textContent = 'Sign in to your account';
        } else {
          // No admin yet or validation error - show setup form
          loadingState.style.display = 'none';
          setupForm.style.display = 'block';
          subtitle.textContent = 'Set up your admin account';
        }
      }

      // Login handler
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;

        if (!username || !password) {
          showError('Please enter both username and password.');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Signing in...';
        hideError();

        try {
          const res = await adminApi('POST', '/api/auth/login', { username, password });
          if (res.success) {
            window.location.href = '/admin/dashboard.html';
          }
        } catch (err) {
          showError(err.message || 'Invalid username or password.');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      });

      // Setup handler
      setupForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('setup-btn');
        const username = document.getElementById('setup-username').value.trim();
        const password = document.getElementById('setup-password').value;
        const confirm = document.getElementById('setup-confirm').value;

        if (!username || !password) {
          showError('Please fill in all fields.');
          return;
        }

        if (password.length < 8) {
          showError('Password must be at least 8 characters.');
          return;
        }

        if (password !== confirm) {
          showError('Passwords do not match.');
          return;
        }

        btn.disabled = true;
        btn.textContent = 'Creating account...';
        hideError();

        try {
          const res = await adminApi('POST', '/api/auth/setup', { username, password });
          if (res.success) {
            showToast('Account created! Signing you in...', 'success');
            // Auto-login
            const loginRes = await adminApi('POST', '/api/auth/login', { username, password });
            if (loginRes.success) {
              window.location.href = '/admin/dashboard.html';
            }
          }
        } catch (err) {
          showError(err.message || 'Setup failed. Please try again.');
          btn.disabled = false;
          btn.textContent = 'Create Account';
        }
      });

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.add('visible');
      }

      function hideError() {
        errorMsg.classList.remove('visible');
      }
    })();
  </script>
</body>
</html>
